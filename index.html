<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>offer</title>
    <!-- font awsome css -->
    <link rel="stylesheet" href="css/all.min.css.css">
    <!-- bootstrab 5 library css -->
    <link rel="stylesheet" href="css/bootstrap.6.min.css">
    <!-- style css -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


<sectin class="main-section container-fluid min-vh-100 d-flex align-items-center justify-content-center">

<div class="row justify-content-center w-100">

<div class="col-12 md:col-5">

<div class="card p-4 shadow-lg rounded-5 bg-white fg-black w-100">

<!-- header card -->

<div class="text-center">

    <span class="mb-3 size"><i class="fa-solid fa-calculator fa-lg" style="color: rgb(177, 151, 252);"></i></span>

<h2>product price calculator</h2>

<p>claculat yout total price easily</p>

</div>
<!-- product form -->
<div>
    <label class="form-label fg-black">
        <span><i class="fa-solid fa-cube" style="color: rgb(177, 151, 252);"></i></span>
        Product
    </label>
    <select name="Product" id="product" class="form-control fg-black bg-white">
        <option value="">select product</option>
        <option value="800">laptop-$800</option>
        <option value="500">phone-$500</option>
        <option value="200">watch-$200</option>
    </select>
</div>

<!--  quantity -->
 <div class="mt-3">
<label class="form-label fg-black">
   <span><i class="fa-solid fa-cart-flatbed" style="color: rgb(177, 151, 252);"></i></span>
    Quantity
</label>
<input type="text" id="quantity" name="quantity" placeholder="Enter Quantity" class="form-control fg-black bg-white" >
 </div>
<!--  descount -->
 <div class="mt-3">
<label class="form-label fg-black">
   <span class="fg-black"><i class="fa-solid fa-tags" style="color: rgb(177, 151, 252);"></i></span>
    Discount
</label>
<input type="text" name="discount" id="discount" placeholder="Enter Discount" class="form-control fg-black bg-white" >
 </div>

 <button onclick="clculatePrice()" class="btn-solid theme-accent mt-4 fw-semibold">Claculat Price</button>

 <div id="result" class="mt-4"></div>
</div>

</div>

</div>


</sectin>

    
    <!-- font awsome js -->
    <script src="js/all.min.js"></script>
    
    <!-- bootstrab 5 js  -->
    <script src="js/bootstrap.6.bundle.min.js"></script>

    <!-- main js  -->
    <script src="js/main.js"></script>


</body>

</html>
